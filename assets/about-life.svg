sumé dump.</text><rect x="48" y="260" width="432" height="116" rx="18" fill="#0b1424" stroke="#1c4672" stroke-width="1"/><text x="68" y="288" fill="#6fe7ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">01</text><text x="116" y="288" fill="#66798f" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">BUILDING NOW</text><text x="116" y="322" fill="#dce6f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Multiple projects across AI, automation, web technologies, and DevOps — while constantly experimenting with new ideas.</text><text x="116" y="346" fill="#66798f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">menting with new ideas.</text><rect x="520" y="260" width="432" height="116" rx="18" fill="#0b1424" stroke="#1c4672" stroke-width="1"/><text x="540" y="288" fill="#6fe7ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">02</text><text x="588" y="288" fill="#66798f" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">COLLABORATE</text><text x="588" y="322" fill="#dce6f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">AI-powered projects, automation, innovative web experiences, open-source ideas, and anything that pushes technology forward.</text><text x="588" y="346" fill="#66798f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">at pushes technology forward.</text><rect x="48" y="410" width="432" height="116" rx="18" fill="#0b1424" stroke="#1c4672" stroke-width="1"/><text x="68" y="438" fill="#6fe7ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">03</text><text x="116" y="438" fill="#ff354f" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">SOLVE</text><text x="116" y="472" fill="#dce6f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Turning ambitious ideas into scalable, reliable, and production-ready projects.</text><text x="116" y="496" fill="#66798f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start"></text><rect x="520" y="410" width="432" height="116" rx="18" fill="#0b1424" stroke="#1c4672" stroke-width="1"/><text x="540" y="438" fill="#6fe7ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">04</text><text x="588" y="438" fill="#66798f" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">LEARNING</text><text x="588" y="472" fill="#dce6f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">The latest developments in AI, LLMs, automation, DevOps, and modern technologies — always keeping myself up to date.</text><text x="588" y="496" fill="#66798f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">ng myself up to date.</text><rect x="48" y="594" width="904" height="116" rx="18" fill="#0b1424" stroke="#1c4672" stroke-width="1"/><text x="68" y="622" fill="#6fe7ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">05</text><text x="116" y="622" fill="#66798f" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="start">FUN FACT</text><text x="116" y="656" fill="#dce6f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">I don't wait for an idea to become possible — I figure out how to build it. AI is just another tool in the arsenal.</text><text x="116" y="680" fill="#66798f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">tool in the arsenal.</text><text x="48" y="742" fill="#66798f" font-family="ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start">CURIOSITY FIRST  ·  EXECUTION SECOND  ·  POLISH ALWAYS</text></svg>